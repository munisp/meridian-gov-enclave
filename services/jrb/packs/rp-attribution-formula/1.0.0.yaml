id: rp-attribution-formula
version: 1.0.0
effective_from: 2026-01-01
effective_to: null
status: published
subject_to_regazette: true
provenance:
  as_passed: "Nigeria Tax Administration Act 2025 — VAT revenue attribution"
  as_gazetted: "NTAA 2025 (gazette): states'/LGAs' share distributed 50% equality, 20% population, 30% place of consumption"
  source_citation: "NTAA 2025 s. VAT attribution formula (gazetted weights: 50/20/30; no derivation limb)"
rules:
  - id: attr.vat.state_share
    when: { revenue_type: vat }
    then:
      formula: "state_share_kobo = pool_kobo * (0.50/n_states + 0.20*state_population_bps/10000 + 0.30*state_consumption_bps/10000)"
      equality_weight_bps: 5000
      population_weight_bps: 2000
      place_of_consumption_weight_bps: 3000
      narrate: "Gazetted NTAA 2025 horizontal attribution: 50% equality, 20% population, 30% place of consumption. No derivation limb."
  - id: attr.feed.integrity
    when: { output: attribution_feed }
    then: { signed: true, algorithm: ed25519, narrate: "Attribution feeds are signed before cross-zone serving (F7)" }
